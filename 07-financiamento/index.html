<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulador de Financiamento</title>
  <link rel="stylesheet" href="style.css"/>
    <script src="financiamento.js" defer type="module"></script>
</head>
<body>

  <div class="container">

    <a href="../index.html">← Voltar</a>

    <h1>Simulador de<br><span>Financiamento</span></h1>
    <p>Informe os dados para simular as parcelas com juros compostos.</p>

    <div class="grid">
      <div class="campo">
        <label for="valor">Valor Total (R$)</label>
        <input id="valor" type="number" placeholder="Ex: 12000"/>
      </div>
      <div class="campo">
        <label for="taxa">Taxa de Juros (% ao mês)</label>
        <input id="taxa" type="number" placeholder="Ex: 1.5" step="0.1"/>
      </div>
      <div class="campo">
        <label for="parcelas">Número de Parcelas</label>
        <input id="parcelas" type="number" placeholder="Ex: 12"/>
      </div>
    </div>

    <button id="simular">Simular Financiamento</button>

    <div class="resultado">
      <p class="resultado-titulo">Resultado</p>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Mês</th>
              <th>Parcela</th>
              <th>Juros do Mês</th>
              <th>Total do Mês</th>
              <th>Saldo Devedor</th>
            </tr>
          </thead>
          <tbody id="financiamentoBody"></tbody>
        </table>
      </div>
    </div>

  </div>

</body>
</html>
